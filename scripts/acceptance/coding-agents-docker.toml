# Acceptance fixture (--coding-agents, step 11): coding-agents.toml plus the
# host's engine, rootless as the agent (docker = "rootless").
include = ["host.toml"]

[[users.create]]
name = "agent"
shell = "/bin/bash"
ssh_authorized_keys = ["${ANVIL_ACCEPT_PUBKEY}"]

[coding_agents]
skills = [
  { source = "vercel-labs/skills", names = ["find-skills"] },
  { source = "anthropics/skills", names = ["frontend-design"], agents = ["opencode"] },
]
claude_marketplaces = ["anthropics/claude-plugins-official"]
claude_plugins = ["commit-commands@claude-plugins-official"]
opencode_plugins = ["@dietrichgebert/ponytail"]
opencode_mcp = { context-mode = ["npx", "-y", "context-mode@next", "server", "--agent", "opencode"] }
cpu_quota = "200%"
memory_max = "4G"
tasks_max = 512
docker = "rootless"
