<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub runner flow</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 16px;
    }
    .frame { max-width: 1320px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1280px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · [github_runner] v1 · your server</p>
    <h1>A persistent runner, no container: jobs run natively on the box</h1>

    <div class="diagram-container">
      <svg viewBox="0 72 1280 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="github-runner-flow-title github-runner-flow-desc">
        <title id="github-runner-flow-title">GitHub runner on your server</title>
        <desc id="github-runner-flow-desc">anvil installs a persistent GitHub Actions runner under systemd on the host using a one-hour registration token; the runner's listener long-polls GitHub over outbound HTTPS, receives a job, spawns a worker that runs the steps natively as the unprivileged github-runner user in a workspace wiped after each job, inside the unit's optional cgroup caps (cpu_quota, memory_max, tasks_max), and only reaches Docker if docker = "group" is opted in.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect x="0" y="72" width="1280" height="640" fill="#f5f5f5"/>

        <!-- Zones -->
        <rect x="68" y="112" width="216" height="128" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="76" y="116" width="88" height="12" rx="2" fill="#f5f5f5"/>
        <text x="120" y="125" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">YOUR MAC · ONCE</text>

        <rect x="332" y="112" width="616" height="456" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="532" y="116" width="216" height="12" rx="2" fill="#f5f5f5"/>
        <text x="640" y="125" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">YOUR SERVER · 1..N RUNNERS · NO INBOUND</text>

        <rect x="996" y="112" width="216" height="128" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="1120" y="116" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="1156" y="125" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">GITHUB.COM</text>

        <!-- Arrows (behind nodes) -->
        <!-- registration token: GitHub -> your Mac, routed above the zones -->
        <path d="M 1104,144 V 100 Q 1104,92 1096,92 H 184 Q 176,92 176,100 V 144" fill="none" stroke="#2e5aa8" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-link)"/>
        <!-- anvil installs over ssh -->
        <line x1="252" y1="176" x2="364" y2="176" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- unit keeps listener alive -->
        <line x1="548" y1="176" x2="732" y2="176" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- listener long-polls GitHub (outbound) -->
        <line x1="916" y1="164" x2="1028" y2="164" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <!-- job comes back on the same connection -->
        <line x1="1028" y1="192" x2="916" y2="192" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <!-- listener spawns a worker per job -->
        <line x1="824" y1="208" x2="824" y2="304" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- worker builds in the workspace -->
        <line x1="732" y1="336" x2="548" y2="336" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- optional docker -->
        <line x1="824" y1="368" x2="824" y2="464" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

        <!-- Arrow labels -->
        <rect x="596" y="74" width="96" height="12" rx="2" fill="#f5f5f5"/>
        <text x="644" y="83" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REG TOKEN · 1H</text>
        <rect x="268" y="158" width="80" height="12" rx="2" fill="#f5f5f5"/>
        <text x="308" y="167" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SSH · INSTALL</text>
        <rect x="596" y="158" width="88" height="12" rx="2" fill="#f5f5f5"/>
        <text x="640" y="167" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RESTART=ALWAYS</text>
        <rect x="928" y="146" width="88" height="12" rx="2" fill="#f5f5f5"/>
        <text x="972" y="155" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LONG-POLL :443</text>
        <rect x="956" y="198" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="972" y="207" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">JOB</text>
        <rect x="834" y="250" width="88" height="12" rx="2" fill="#f5f5f5"/>
        <text x="878" y="259" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SPAWNS PER JOB</text>
        <rect x="604" y="318" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="640" y="327" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">BUILD · TEST</text>
        <rect x="834" y="410" width="68" height="12" rx="2" fill="#f5f5f5"/>
        <text x="868" y="419" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">OPT-IN ONLY</text>

        <!-- Node: anvil apply (input) -->
        <rect x="100" y="144" width="152" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="100" y="144" width="152" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <rect x="108" y="152" width="28" height="12" rx="2" fill="transparent" stroke="rgba(90,101,128,0.40)" stroke-width="0.8"/>
        <text x="122" y="161" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CLI</text>
        <text x="176" y="180" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">anvil apply</text>
        <text x="176" y="196" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">[github_runner]</text>

        <!-- Node: systemd unit -->
        <rect x="364" y="144" width="184" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="364" y="144" width="184" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="372" y="152" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="386" y="161" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SVC</text>
        <text x="456" y="180" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">systemd unit</text>
        <text x="456" y="196" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">anvil-github-runner-build-1</text>
        <!-- optional cgroup caps (GR17), shared by the listener and every job -->
        <text x="456" y="228" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">OPT-IN CGROUP CAPS</text>
        <text x="456" y="242" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">cpu_quota · memory_max · tasks_max</text>

        <!-- Node: Runner.Listener (focal) -->
        <rect x="732" y="144" width="184" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="732" y="144" width="184" height="64" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <rect x="740" y="152" width="32" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.50)" stroke-width="0.8"/>
        <text x="756" y="161" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CORE</text>
        <text x="824" y="180" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Runner listener</text>
        <text x="824" y="196" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">persistent · /opt/github-runner</text>

        <!-- Node: Runner.Worker -->
        <rect x="732" y="304" width="184" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="732" y="304" width="184" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="740" y="312" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="754" y="321" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">JOB</text>
        <text x="824" y="340" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Runner worker</text>
        <text x="824" y="356" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">steps as github-runner, no sudo</text>

        <!-- Node: workspace (store) -->
        <rect x="364" y="304" width="184" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="364" y="304" width="184" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="372" y="312" width="36" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
        <text x="390" y="321" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FILES</text>
        <text x="456" y="340" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Job workspace</text>
        <text x="456" y="356" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">_work · wiped after each job</text>

        <!-- Node: Docker (optional) -->
        <rect x="732" y="464" width="184" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="732" y="464" width="184" height="64" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
        <rect x="740" y="472" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
        <text x="754" y="481" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OPT</text>
        <text x="824" y="500" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Docker daemon</text>
        <text x="824" y="516" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">docker = "group" · root-equiv.</text>

        <!-- Node: GitHub Actions (external) -->
        <rect x="1028" y="144" width="152" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="1028" y="144" width="152" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="1036" y="152" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
        <text x="1050" y="161" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
        <text x="1104" y="180" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">GitHub Actions</text>
        <text x="1104" y="196" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">private repos · job queue</text>

        <!-- Callout -->
        <text x="364" y="428" fill="#4f5d75" font-size="13" font-style="italic" font-family="'Instrument Serif', serif">No container by default: cargo, clippy and</text>
        <text x="364" y="446" fill="#4f5d75" font-size="13" font-style="italic" font-family="'Instrument Serif', serif">tests run straight on the host's CPUs, inside the unit's cgroup.</text>

        <!-- Legend strip -->
        <line x1="68" y1="616" x2="1212" y2="616" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="68" y="636" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="68" y="652" width="14" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="88" y="660" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Always running</text>
        <rect x="196" y="652" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="216" y="660" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Component</text>
        <rect x="304" y="652" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="324" y="660" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">State on host</text>
        <rect x="420" y="652" width="14" height="10" rx="2" fill="#ffffff" stroke="#4f5d75" stroke-width="1" stroke-dasharray="3,2"/>
        <text x="440" y="660" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Opt-in</text>
        <rect x="508" y="652" width="14" height="10" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="528" y="660" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">External</text>

        <line x1="620" y1="657" x2="648" y2="657" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="656" y="660" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Outbound HTTPS, the only connection</text>
        <line x1="840" y1="657" x2="868" y2="657" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <text x="876" y="660" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Reply or optional</text>
        <line x1="984" y1="657" x2="1012" y2="657" stroke="#2e5aa8" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-link)"/>
        <text x="1020" y="660" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Minted by you (gh api)</text>
      </svg>
    </div>
  </div>
</body>
</html>
