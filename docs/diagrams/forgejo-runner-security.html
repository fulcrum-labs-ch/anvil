<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>Forgejo runner isolation</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 16px;
    }
    .frame { max-width: 1320px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1280px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Security · [forgejo_runner] · what a hostile job reaches</p>
    <h1>:host keeps jobs off root; docker = "group" hands them root</h1>
    <div class="diagram-container">
<svg viewBox="0 0 1280 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="forgejo-runner-security-title forgejo-runner-security-desc">
<title id="forgejo-runner-security-title">Forgejo runner: what a hostile job reaches</title>
<desc id="forgejo-runner-security-desc">With :host labels a hostile job reaches the host as the unprivileged forgejo-runner user, including the runner token but not root-only files; with docker = "group" it is root on the host; a future sandbox per job would confine it to its own sandbox.</desc>

<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>

</defs>
<rect x="0" y="0" width="1280" height="480" fill="#f5f5f5"/>
<text x="24" y="44" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist Mono', monospace" letter-spacing="0.14em">:HOST LABELS · TODAY</text>

<rect x="226" y="146" width="56" height="12" rx="2" fill="#f5f5f5"/><text x="254" y="155" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REACHES</text>

<text x="48" y="216" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif"><tspan font-weight="600">✔</tspan>  its home /var/lib/forgejo-runner</text>
<text x="48" y="242" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif"><tspan font-weight="600">✔</tspan>  the runner token in config.yml</text>
<text x="48" y="268" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif"><tspan font-weight="600">✔</tspan>  world-readable files, read-only</text>

<text x="48" y="346" fill="#5a6580" font-size="11" font-family="'Geist', sans-serif"><tspan font-weight="600">✘</tspan>  sudo, capabilities, /home, devices</text>
<rect x="124" y="72" width="184" height="56" rx="6" fill="#f5f5f5"/>
<rect x="124" y="72" width="184" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>

<text x="146" y="89" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">JOB</text>
<text x="216" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Hostile job</text>
<text x="216" y="118" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">as forgejo-runner · no sudo</text>
<text x="448" y="44" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist Mono', monospace" letter-spacing="0.14em">DOCKER = &quot;GROUP&quot; · TODAY</text>
<line x1="640" y1="128" x2="640" y2="176" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
<rect x="650" y="146" width="56" height="12" rx="2" fill="#f5f5f5"/><text x="678" y="155" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REACHES</text>
<rect x="448" y="176" width="384" height="200" rx="8" fill="rgba(191,69,32,0.07)" stroke="#bf4520" stroke-width="1"/>
<rect x="580" y="170" width="120" height="12" rx="2" fill="#f5f5f5"/><text x="640" y="179" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">ROOT ON THE HOST</text>
<text x="472" y="216" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif"><tspan font-weight="600">✔</tspan>  docker run -v /:/host --privileged</text>
<text x="472" y="242" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif"><tspan font-weight="600">✔</tspan>  every file, the GitHub App key too</text>
<text x="472" y="268" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif"><tspan font-weight="600">✔</tspan>  every other service on the host</text>
<text x="472" y="294" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif"><tspan font-weight="600">✔</tspan>  outside ci.slice and its caps</text>
<rect x="548" y="72" width="184" height="56" rx="6" fill="#f5f5f5"/>
<rect x="548" y="72" width="184" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<rect x="556" y="80" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
<text x="570" y="89" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">JOB</text>
<text x="640" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Hostile job</text>
<text x="640" y="118" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">docker:// · docker group</text>
<text x="872" y="44" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist Mono', monospace" letter-spacing="0.14em">SANDBOX PER JOB · FUTURE</text>
<line x1="1064" y1="128" x2="1064" y2="176" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="1074" y="146" width="56" height="12" rx="2" fill="#f5f5f5"/><text x="1102" y="155" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REACHES</text>
<rect x="872" y="176" width="384" height="200" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.14)" stroke-width="0.8" stroke-dasharray="4,3"/>
<rect x="1004" y="170" width="120" height="12" rx="2" fill="#f5f5f5"/><text x="1064" y="179" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">ONLY ITS SANDBOX</text>
<text x="896" y="216" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif"><tspan font-weight="600">✔</tspan>  its own workspace and Docker</text>
<text x="896" y="242" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif"><tspan font-weight="600">✔</tspan>  the runner token (no JIT tokens yet)</text>
<text x="896" y="268" fill="#5a6580" font-size="11" font-family="'Geist', sans-serif"><tspan font-weight="600">✘</tspan>  host files, host Docker</text>
<text x="896" y="294" fill="#5a6580" font-size="11" font-family="'Geist', sans-serif"><tspan font-weight="600">✘</tspan>  the next job: sandbox removed</text>
<rect x="972" y="72" width="184" height="56" rx="6" fill="#f5f5f5"/>
<rect x="972" y="72" width="184" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-dasharray="4,3"/>
<rect x="980" y="80" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
<text x="994" y="89" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">JOB</text>
<text x="1064" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Hostile job</text>
<text x="1064" y="118" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">fresh sandbox · one job</text>
