<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>From TOML to host · Data flow</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #f5f5f5; --paper-2: #ececec; --ink: #2d3142; --muted: #4f5d75;
      --soft: #5a6580; --rule: rgba(45,49,66,0.12); --accent: #bf4520;
      --accent-tint: rgba(191,69,32,0.08); --link: #2e5aa8;
      --sans: 'Geist', system-ui, sans-serif; --serif: 'Instrument Serif', serif;
      --mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; background: var(--paper); color: var(--ink); font-family: var(--sans); }
    .frame { width: 100%; max-width: 1200px; }
    .eyebrow { margin-bottom: 0.5rem; color: var(--muted); font: 500 0.66rem var(--mono); letter-spacing: 0.18em; text-transform: uppercase; }
    h1 { margin-bottom: 1.5rem; color: var(--ink); font: 400 clamp(1.5rem, 2.4vw + 0.75rem, 2rem)/1.15 var(--serif); letter-spacing: -0.02em; }
    .scroll { overflow-x: auto; }
    svg { display: block; width: 100%; min-width: 840px; }
    .step-number, .step-label, .lane-label, .role-text, .legend-label { font-family: var(--mono); text-anchor: middle; }
    .step-number { fill: var(--ink); font-size: 7px; font-weight: 600; }
    .step-label { fill: var(--muted); font-size: 7px; font-weight: 500; letter-spacing: 0.12em; }
    .lane-label { fill: var(--muted); font-size: 8px; font-weight: 500; letter-spacing: 0.14em; }
    .role-text { fill: var(--ink); font-size: 6px; font-weight: 600; }
    .node-title { fill: var(--ink); font: 600 9px var(--sans); text-anchor: middle; }
    .node-sub { fill: var(--muted); font: 400 6.5px var(--mono); text-anchor: middle; }
    .node-tool { fill: var(--soft); font: 400 6.5px var(--mono); text-anchor: middle; }
    .focal-text { fill: var(--accent); }
    .legend-label { fill: var(--muted); font-size: 7px; font-weight: 500; letter-spacing: 0.12em; text-anchor: end; }
    .legend-text { fill: var(--muted); font: 400 7px var(--sans); }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">anvil · Architecture</p>
    <h1>From TOML to host</h1>

    <div class="scroll">
    <svg viewBox="0 0 840 256" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="declaration-dataflow-title declaration-dataflow-desc">
      <title id="declaration-dataflow-title">From TOML to host</title>
      <desc id="declaration-dataflow-desc">The loaded config yields one module per enabled section; each module builds a Declaration, from which the engine renders the probe, apply and rollback scripts that run on the host and print marker lines parsed back into typed results.</desc>
      <defs>
        <pattern id="declaration-dataflow-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="11" cy="11" r="0.8" fill="rgba(45,49,66,0.10)"/></pattern>
        <marker id="declaration-dataflow-arr-muted" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#4f5d75"/></marker>
        <marker id="declaration-dataflow-arr-accent" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#bf4520"/></marker>
        <marker id="declaration-dataflow-arr-link" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#2e5aa8"/></marker>
      </defs>
      <rect width="840" height="256" fill="#f5f5f5"/>
      <rect width="840" height="256" fill="url(#declaration-dataflow-dots)"/>
      <rect x="0" y="116" width="840" height="80" fill="rgba(45,49,66,0.018)"/>

      <!-- Header and lane structure -->
      <line x1="0" y1="36" x2="840" y2="36" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <line x1="0" y1="116" x2="840" y2="116" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <line x1="0" y1="196" x2="840" y2="196" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <line x1="140" y1="36" x2="140" y2="196" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>

      <g aria-label="Pipeline steps">
        <rect x="180" y="6" width="32" height="16" rx="8" fill="rgba(45,49,66,0.12)"/><text x="196" y="17" class="step-number">01</text><text x="196" y="31" class="step-label">LOAD</text>
        <rect x="292" y="6" width="32" height="16" rx="8" fill="rgba(45,49,66,0.12)"/><text x="308" y="17" class="step-number">02</text><text x="308" y="31" class="step-label">MODULE</text>
        <rect x="404" y="6" width="32" height="16" rx="8" fill="rgba(191,69,32,0.20)"/><text x="420" y="17" class="step-number focal-text">03</text><text x="420" y="31" class="step-label focal-text">DECLARE</text>
        <rect x="516" y="6" width="32" height="16" rx="8" fill="rgba(45,49,66,0.12)"/><text x="532" y="17" class="step-number">04</text><text x="532" y="31" class="step-label">RENDER</text>
        <rect x="628" y="6" width="32" height="16" rx="8" fill="rgba(45,49,66,0.12)"/><text x="644" y="17" class="step-number">05</text><text x="644" y="31" class="step-label">RUN</text>
        <rect x="740" y="6" width="32" height="16" rx="8" fill="rgba(45,49,66,0.12)"/><text x="756" y="17" class="step-number">06</text><text x="756" y="31" class="step-label">REPORT</text>
      </g>

      <g aria-label="Where each step runs">
        <text x="70" y="72" class="lane-label">OPERATOR</text><text x="70" y="84" class="lane-label">MACHINE</text>
        <text x="70" y="152" class="lane-label">TARGET</text><text x="70" y="164" class="lane-label">HOST</text>
      </g>

      <!-- Connectors first. Cross-lane paths use r=8 orthogonal elbows. -->
      <path d="M246 76 H258" fill="none" stroke="#4f5d75" marker-end="url(#declaration-dataflow-arr-muted)"/>
      <path d="M358 76 H370" fill="none" stroke="#4f5d75" marker-end="url(#declaration-dataflow-arr-muted)"/>
      <path d="M470 76 H482" fill="none" stroke="#4f5d75" marker-end="url(#declaration-dataflow-arr-muted)"/>
      <path d="M582 76 H636 Q644 76 644 84 V124" fill="none" stroke="#bf4520" stroke-width="1.2" marker-end="url(#declaration-dataflow-arr-accent)"/>
      <path d="M694 156 H748 Q756 156 756 148 V108" fill="none" stroke="#2e5aa8" stroke-dasharray="5,4" marker-end="url(#declaration-dataflow-arr-link)"/>
      <rect x="584" y="56" width="50" height="12" rx="2" fill="#f5f5f5"/>
      <text x="609" y="65" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SSH STDIN</text>

      <!-- Operator: Config -->
      <rect x="146" y="44" width="100" height="64" rx="6" fill="#f5f5f5" stroke="rgba(45,49,66,0.25)"/>
      <rect x="150" y="48" width="18" height="10" rx="3" fill="rgba(45,49,66,0.12)"/><text x="159" y="55" class="role-text">OPR</text>
      <text x="196" y="72" class="node-title">Config</text><text x="196" y="84" class="node-sub">toml · include · ${ENV}</text><text x="196" y="96" class="node-tool">validated, sorted</text>

      <!-- Operator: Module -->
      <rect x="258" y="44" width="100" height="64" rx="6" fill="#f5f5f5" stroke="rgba(45,49,66,0.25)"/>
      <rect x="262" y="48" width="18" height="10" rx="3" fill="rgba(45,49,66,0.12)"/><text x="271" y="55" class="role-text">OPR</text>
      <text x="308" y="72" class="node-title">Module</text><text x="308" y="84" class="node-sub">one per section</text><text x="308" y="96" class="node-tool">or plugin::&lt;name&gt;</text>

      <!-- Operator: Declaration (focal) -->
      <rect x="370" y="44" width="100" height="64" rx="6" fill="rgba(191,69,32,0.07)" stroke="#bf4520" stroke-width="1.2"/>
      <rect x="374" y="48" width="18" height="10" rx="3" fill="rgba(191,69,32,0.20)"/><text x="383" y="55" class="role-text focal-text">OPR</text>
      <text x="420" y="72" class="node-title">Declaration</text><text x="420" y="84" class="node-sub">ManagedFile · Command</text><text x="420" y="96" class="node-tool">+ ReloadGuard</text>

      <!-- Operator: Scripts -->
      <rect x="482" y="44" width="100" height="64" rx="6" fill="#f5f5f5" stroke="rgba(45,49,66,0.25)"/>
      <rect x="486" y="48" width="18" height="10" rx="3" fill="rgba(45,49,66,0.12)"/><text x="495" y="55" class="role-text">OPR</text>
      <text x="532" y="72" class="node-title">Scripts</text><text x="532" y="84" class="node-sub">probe · apply · rollback</text><text x="532" y="96" class="node-tool">+ diff, all bash</text>

      <!-- Host: bash run -->
      <rect x="594" y="124" width="100" height="64" rx="6" fill="#f5f5f5" stroke="rgba(45,49,66,0.25)"/>
      <rect x="598" y="128" width="18" height="10" rx="3" fill="rgba(45,49,66,0.12)"/><text x="607" y="135" class="role-text">HST</text>
      <text x="644" y="152" class="node-title">bash on host</text><text x="644" y="164" class="node-sub">-euo pipefail</text><text x="644" y="176" class="node-tool">prints marker lines</text>

      <!-- Operator: Results -->
      <rect x="706" y="44" width="100" height="64" rx="6" fill="#f5f5f5" stroke="rgba(45,49,66,0.25)"/>
      <rect x="710" y="48" width="18" height="10" rx="3" fill="rgba(45,49,66,0.12)"/><text x="719" y="55" class="role-text">OPR</text>
      <text x="756" y="72" class="node-title">Results</text><text x="756" y="84" class="node-sub">Verdict · ApplyStatus</text><text x="756" y="96" class="node-tool">table · json · ndjson</text>

      <!-- Legend: steps -->
      <text x="164" y="217" class="legend-label">STEPS</text>
      <rect x="180" y="208" width="24" height="12" rx="6" fill="rgba(45,49,66,0.12)"/><text x="192" y="216" class="step-number">01</text><text x="212" y="217" class="legend-text">Load</text>
      <rect x="264" y="208" width="24" height="12" rx="6" fill="rgba(45,49,66,0.12)"/><text x="276" y="216" class="step-number">02</text><text x="296" y="217" class="legend-text">Module</text>
      <rect x="356" y="208" width="24" height="12" rx="6" fill="rgba(191,69,32,0.20)"/><text x="368" y="216" class="step-number focal-text">03</text><text x="388" y="217" class="legend-text">Declare</text>
      <rect x="448" y="208" width="24" height="12" rx="6" fill="rgba(45,49,66,0.12)"/><text x="460" y="216" class="step-number">04</text><text x="480" y="217" class="legend-text">Render</text>
      <rect x="540" y="208" width="24" height="12" rx="6" fill="rgba(45,49,66,0.12)"/><text x="552" y="216" class="step-number">05</text><text x="572" y="217" class="legend-text">Run</text>
      <rect x="616" y="208" width="24" height="12" rx="6" fill="rgba(45,49,66,0.12)"/><text x="628" y="216" class="step-number">06</text><text x="648" y="217" class="legend-text">Report</text>

      <!-- Legend: flow -->
      <text x="164" y="240" class="legend-label">FLOW</text>
      <line x1="180" y1="237" x2="204" y2="237" stroke="#4f5d75" marker-end="url(#declaration-dataflow-arr-muted)"/><text x="212" y="240" class="legend-text">In-process handoff</text>
      <line x1="320" y1="237" x2="344" y2="237" stroke="#bf4520" stroke-width="1.2" marker-end="url(#declaration-dataflow-arr-accent)"/><text x="352" y="240" class="legend-text">Script over ssh (local bash for hetzner)</text>
      <line x1="540" y1="237" x2="564" y2="237" stroke="#2e5aa8" stroke-dasharray="5,4" marker-end="url(#declaration-dataflow-arr-link)"/><text x="572" y="240" class="legend-text">OK: / DRIFTED: / CHANGED: / FAILED: on stdout</text>
    </svg>
    </div>
  </main>
</body>
</html>
