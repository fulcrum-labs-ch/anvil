      font-weight: 400;

  <div class="frame">
    <p class="eyebrow">Sequence · [github_runner] v2 · why the App exists</p>
    <h1>The App key lets your server ask GitHub for a fresh one-job runner, every time</h1>
    <div class="diagram-container">
<svg viewBox="0 64 1280 772" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="github-runner-v2-title github-runner-v2-desc">
<title id="github-runner-v2-title">How a v2 runner gets each job</title>
<desc id="github-runner-v2-desc">anvil puts the GitHub App key root-only on the host once; for every job the minter signs a request with the key, gets a one-hour token, asks GitHub for a one-job runner in group my-runners, starts a fresh capped sysbox sandbox with it, the runner in the sandbox receives a queued job from your-repo, runs it with its own Docker, reports back and disappears, and the minter deletes the sandbox and its volume.</desc>
