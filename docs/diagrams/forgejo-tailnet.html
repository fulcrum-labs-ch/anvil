<style>

.frame{max-width:1320px;width:100%}

<body>
<div class="frame">
<p class="eyebrow">[tailscale] + [caddy] + [forgejo] + [fail2ban] · listen = "tailnet"</p>
<h1>Only tailnet devices reach Forgejo; the internet hits a closed door</h1>
<svg data-diagram="architecture" viewBox="0 0 1280 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="forgejo-tailnet-title forgejo-tailnet-desc">
<title id="forgejo-tailnet-title">Forgejo reachable only over the tailnet</title>
<desc id="forgejo-tailnet-desc">A tailnet laptop reaches Caddy on 443 and Forgejo's SSH server on 2222 through ufw rules scoped to tailscale0; the public internet is blocked. Caddy terminates TLS with a tailscaled or DNS-01 certificate and proxies to Forgejo on 127.0.0.1:3000. Forgejo writes repositories and its log to /var/lib/forgejo and reads app.ini and secret files from /etc/forgejo. fail2ban reads the log and bans the IP of failed web logins at the firewall.</desc>

<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
<marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
</defs>

<text x="320" y="76" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" letter-spacing="0.14em">&lt;HOST&gt; · DEBIAN / UBUNTU · UFW DEFAULT DENY</text>

<text x="918" y="229" fill="#5a6580" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">COMPOSE: READ-ONLY CONTAINER</text>

<rect x="456" y="428" width="76" height="14" rx="2" fill="#f5f5f5"/><text x="494" y="438" fill="#bf4520" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.1em">BAN IP</text>

<!-- ufw -->
<rect x="320" y="250" width="160" height="64" rx="6" fill="#fff" stroke="#2d3142" stroke-width="1.4"/>
