<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>One anvil apply · Swimlane</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 1rem;
    }

    .frame { max-width: 1280px; width: 100%; min-width: 0; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    .diagram-container { width: 100%; overflow-x: auto; }
    svg { width: 100%; min-width: 1280px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Swimlane · anvil apply</p>
    <h1>One <em>apply</em>, per host</h1>

    <div class="diagram-container">
    <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="apply-workflow-title apply-workflow-desc">
      <title id="apply-workflow-title">One anvil apply, per host</title>
      <desc id="apply-workflow-desc">Swimlane of one anvil apply: the operator machine loads, orders and renders scripts; the target host probes each module, leaves aligned ones alone, converges drifted ones behind a reload guard; a failed check restores backups, reports FAILED and skips the firewall and updates.</desc>
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
        </pattern>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <!-- Lane dividers -->
      <line x1="40" y1="80" x2="1240" y2="80" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <line x1="40" y1="240" x2="1240" y2="240" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
      <line x1="40" y1="420" x2="1240" y2="420" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
      <line x1="40" y1="600" x2="1240" y2="600" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <line x1="176" y1="80" x2="176" y2="600" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>

      <!-- Lane labels -->
      <text x="56" y="156" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">OPERATOR</text>
      <text x="56" y="168" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">MACHINE</text>
      <text x="56" y="326" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">TARGET HOST</text>
      <text x="56" y="338" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">PER MODULE</text>
      <text x="56" y="506" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">ON FAILURE</text>
      <text x="56" y="518" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CONTAINMENT</text>

      <!-- Arrows (drawn first) -->
      <!-- Load → Order -->
      <line x1="368" y1="160" x2="404" y2="160" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Order → Probe (handoff over ssh) -->
      <line x1="488" y1="188" x2="488" y2="298" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Probe → Report: OK, nothing written -->
      <path d="M 544,302 V 224 Q 544,216 552,216 H 1084 Q 1092,216 1092,208 V 192" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <!-- Probe → Converge: DRIFTED -->
      <line x1="568" y1="330" x2="644" y2="330" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Converge → ReloadGuard -->
      <line x1="808" y1="330" x2="884" y2="330" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- ReloadGuard → Report: CHANGED -->
      <path d="M 1048,330 H 1132 Q 1140,330 1140,322 V 192" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- ReloadGuard → Auto-revert: check failed -->
      <line x1="968" y1="358" x2="968" y2="478" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- Auto-revert → Report: FAILED -->
      <path d="M 1048,510 H 1180 Q 1188,510 1188,502 V 192" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Auto-revert → Skip later modules -->
      <line x1="888" y1="510" x2="812" y2="510" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

      <!-- Arrow labels -->
      <rect x="420" y="232" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="448" y="241" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">OVER SSH</text>

      <rect x="780" y="194" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="820" y="203" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">OK: LEFT ALONE</text>

      <rect x="580" y="308" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="608" y="317" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DRIFTED:</text>

      <rect x="810" y="308" width="76" height="12" rx="2" fill="#f5f5f5"/>
      <text x="848" y="317" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FILES WRITTEN</text>

      <rect x="1064" y="308" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="1092" y="317" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CHANGED:</text>

      <rect x="976" y="400" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="1012" y="409" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CHECK FAILED</text>

      <rect x="1088" y="488" width="52" height="12" rx="2" fill="#f5f5f5"/>
      <text x="1114" y="497" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FAILED:</text>

      <rect x="810" y="488" width="76" height="12" rx="2" fill="#f5f5f5"/>
      <text x="848" y="497" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LATER MODULES</text>

      <!-- Steps: operator machine -->
      <rect x="200" y="132" width="168" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="284" y="156" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Load + validate</text>
      <text x="284" y="172" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">include · profile · ${ENV}</text>

      <rect x="408" y="132" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="488" y="156" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Order + render</text>
      <text x="488" y="172" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">safety edges · scripts</text>

      <rect x="1048" y="132" width="184" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="1140" y="156" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Report</text>
      <text x="1140" y="172" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">table · json · exit 1 on fail</text>

      <!-- Steps: target host -->
      <rect x="408" y="302" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="488" y="326" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Probe</text>
      <text x="488" y="342" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">read-only</text>

      <rect x="648" y="302" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="728" y="326" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Converge</text>
      <text x="728" y="342" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">backup · write · chmod</text>

      <rect x="888" y="302" width="160" height="56" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
      <text x="968" y="326" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ReloadGuard</text>
      <text x="968" y="342" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">sshd -t, then reload</text>

      <!-- Steps: containment -->
      <rect x="888" y="482" width="160" height="56" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
      <text x="968" y="506" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Auto-revert</text>
      <text x="968" y="522" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">restore .anvil.bak</text>

      <rect x="648" y="482" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="728" y="506" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Skip dependents</text>
      <text x="728" y="522" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">firewall · updates</text>

      <!-- Legend -->
      <line x1="40" y1="628" x2="1240" y2="628" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="648" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="664" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="60" y="672" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Step</text>

      <rect x="120" y="664" width="14" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
      <text x="140" y="672" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Lock-out protection</text>

      <rect x="268" y="664" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="288" y="672" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Not run: firewall if sshd/ssh_crypto failed, updates if anything failed</text>

      <line x1="648" y1="669" x2="676" y2="669" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="684" y="672" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Flow · label = marker line</text>

      <line x1="852" y1="669" x2="880" y2="669" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="888" y="672" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Nothing written to the host</text>
    </svg>
    </div>
  </div>
</body>
</html>
