<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Docker or Podman</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 16px;
    }
    .frame { max-width: 1320px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1280px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Decision · [containers] runtime · one engine per host</p>
    <h1>Pick the engine once per host; every module follows it</h1>
    <div class="diagram-container">
<svg viewBox="0 0 1280 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="container-engines-title container-engines-desc">
<title id="container-engines-title">Docker or Podman: one engine per host</title>
<desc id="container-engines-desc">[containers] runtime decides the host's engine: on a Docker host (the default) every module and mode runs; on a Podman host only Quadlets, the runners with docker = "none", native Forgejo and headscale without Headplane run, and the Docker-only modules are refused at validate.</desc>

</defs>

<path d="M 616,88 V 112 Q 616,120 608,120 H 328 Q 320,120 320,128 V 168" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 664,88 V 112 Q 664,120 672,120 H 952 Q 960,120 960,128 V 168" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="412" y="102" width="112" height="12" rx="2" fill="#f5f5f5"/><text x="468" y="111" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">&quot;DOCKER&quot; · UNSET</text>
<rect x="772" y="102" width="72" height="12" rx="2" fill="#f5f5f5"/><text x="808" y="111" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">&quot;PODMAN&quot;</text>
<rect x="24" y="144" width="592" height="300" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.14)" stroke-width="0.8"/>
<rect x="40" y="138" width="150" height="12" rx="2" fill="#f5f5f5"/><text x="115" y="147" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">DOCKER HOST · DEFAULT</text>
<text x="72" y="224" fill="#2d3142" font-size="11" font-family="'Geist Mono', monospace">✔  [docker]</text>
<text x="72" y="250" fill="#2d3142" font-size="11" font-family="'Geist Mono', monospace">✔  [containers] compose</text>
<text x="72" y="276" fill="#2d3142" font-size="11" font-family="'Geist Mono', monospace">✔  [github_runner] v1 none | group · v2</text>
<text x="72" y="302" fill="#2d3142" font-size="11" font-family="'Geist Mono', monospace">✔  [forgejo_runner] none | group</text>
<text x="72" y="328" fill="#2d3142" font-size="11" font-family="'Geist Mono', monospace">✔  [forgejo] native | compose</text>
<text x="72" y="354" fill="#2d3142" font-size="11" font-family="'Geist Mono', monospace">✔  [greptimedb]</text>
<text x="72" y="380" fill="#2d3142" font-size="11" font-family="'Geist Mono', monospace">✔  [headscale] + Headplane</text>
<rect x="200" y="168" width="240" height="32" rx="6" fill="#f5f5f5"/>
<rect x="200" y="168" width="240" height="32" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="320" y="182" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Docker engine</text>
<text x="320" y="195" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">docker-ce, installed by the first module</text>
<rect x="664" y="144" width="592" height="300" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.14)" stroke-width="0.8"/>
<rect x="680" y="138" width="90" height="12" rx="2" fill="#f5f5f5"/><text x="725" y="147" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">PODMAN HOST</text>
<text x="712" y="224" fill="#2d3142" font-size="11" font-family="'Geist Mono', monospace">✔  [containers] quadlet</text>
<text x="712" y="250" fill="#2d3142" font-size="11" font-family="'Geist Mono', monospace">✔  [github_runner] v1 docker = &quot;none&quot;</text>
<text x="712" y="276" fill="#2d3142" font-size="11" font-family="'Geist Mono', monospace">✔  [forgejo_runner] docker = &quot;none&quot;</text>
<text x="712" y="302" fill="#2d3142" font-size="11" font-family="'Geist Mono', monospace">✔  [forgejo] deploy = &quot;native&quot;</text>
<text x="712" y="328" fill="#2d3142" font-size="11" font-family="'Geist Mono', monospace">✔  [headscale] without Headplane</text>
<text x="712" y="362" fill="#bf4520" font-size="13" font-style="italic" font-family="'Instrument Serif', serif"><tspan x="712">Refused at validate: [docker], compose, docker = &quot;group&quot;,</tspan><tspan x="712" dy="16">the v2 runner, Forgejo compose, [greptimedb], Headplane.</tspan></text>
<rect x="840" y="168" width="240" height="32" rx="6" fill="#f5f5f5"/>
<rect x="840" y="168" width="240" height="32" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="960" y="182" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Podman engine</text>
<text x="960" y="195" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">distro podman ≥ 4.4 · Quadlets</text>
<rect x="548" y="24" width="184" height="64" rx="6" fill="#f5f5f5"/>
<rect x="548" y="24" width="184" height="64" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
<rect x="556" y="32" width="28" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.50)" stroke-width="0.8"/>
<text x="570" y="41" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TOML</text>
<text x="640" y="60" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">[containers] runtime</text>
<text x="640" y="76" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">one value per host</text>
<line x1="24" y1="468" x2="1256" y2="468" stroke="rgba(45,49,66,0.14)" stroke-width="0.8"/>
<g font-family="'Geist Mono', monospace" font-size="9" fill="#4f5d75">
<rect x="24" y="486" width="20" height="12" rx="3" fill="rgba(191,69,32,0.08)" stroke="#bf4520"/><text x="52" y="496">the one choice</text>
<rect x="176" y="486" width="20" height="12" rx="3" fill="#ffffff" stroke="#2d3142"/><text x="204" y="496">engine on the host</text>
<text x="360" y="496">✔ section or mode that runs there (validate passes)</text>
</g>
</svg>
    </div>
  </div>
</body>
</html>
