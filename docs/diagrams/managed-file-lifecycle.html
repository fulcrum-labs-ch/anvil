<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A managed file's life · anvil</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 1rem;
    }
    .frame { max-width: 1000px; width: 100%; min-width: 0; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 1.5rem;
    }
    .diagram-container { width: 100%; overflow-x: auto; }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">State machine · anvil engine</p>
    <h1>A managed file's life</h1>

    <div class="diagram-container">
    <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="managed-file-lifecycle-title managed-file-lifecycle-desc">
      <title id="managed-file-lifecycle-title">A managed file's life</title>
      <desc id="managed-file-lifecycle-desc">A file anvil manages goes from untouched to written to aligned; a failed reload guard reverts it to untouched, an out-of-band edit makes it drifted until the next apply, and rollback returns it to untouched.</desc>
      <defs>
        <pattern id="mfl-dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
        </pattern>
        <marker id="mfl-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="mfl-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
      </defs>

      <rect width="960" height="600" fill="#f5f5f5"/>
      <rect width="960" height="600" fill="url(#mfl-dots)" opacity="0.55"/>

      <g transform="translate(0,-32)">
      <!-- Transitions (drawn first) -->
      <!-- start → Untouched -->
      <line x1="70" y1="220" x2="104" y2="220" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#mfl-arrow)"/>
      <!-- Untouched → Written -->
      <line x1="272" y1="220" x2="392" y2="220" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#mfl-arrow)"/>
      <!-- Written → Aligned -->
      <line x1="560" y1="220" x2="680" y2="220" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#mfl-arrow)"/>
      <!-- Written → Untouched: guard fails, revert (accent) -->
      <path d="M 476 184 V 136 Q 476 128 468 128 H 196 Q 188 128 188 136 V 184" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#mfl-arrow-accent)"/>
      <!-- Aligned self-loop: re-apply is a no-op -->
      <path d="M 744 184 V 156 Q 744 148 752 148 H 776 Q 784 148 784 156 V 184" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#mfl-arrow)"/>
      <!-- Aligned → Drifted: hand edit -->
      <path d="M 736 256 V 412 Q 736 420 728 420 H 560" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#mfl-arrow)"/>
      <!-- Drifted → Written: check, then apply -->
      <line x1="476" y1="384" x2="476" y2="256" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#mfl-arrow)"/>
      <!-- Aligned → Untouched: rollback (dashed) -->
      <path d="M 792 256 V 484 Q 792 492 784 492 H 196 Q 188 492 188 484 V 256" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#mfl-arrow)"/>

      <!-- Transition labels -->
      <g font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.08em" text-anchor="middle">
        <rect x="284" y="200" width="96" height="12" rx="2" fill="#f5f5f5"/>
        <text x="332" y="209" fill="#4f5d75">PROBE: DRIFTED</text>

        <rect x="572" y="200" width="96" height="12" rx="2" fill="#f5f5f5"/>
        <text x="620" y="209" fill="#4f5d75">GUARD PASSES</text>

        <rect x="284" y="108" width="96" height="12" rx="2" fill="#f5f5f5"/>
        <text x="332" y="117" fill="#bf4520">FAILED: REVERT</text>

        <rect x="720" y="128" width="88" height="12" rx="2" fill="#f5f5f5"/>
        <text x="764" y="137" fill="#4f5d75">RE-APPLY: OK</text>

        <rect x="600" y="400" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="632" y="409" fill="#4f5d75">HAND EDIT</text>

        <rect x="376" y="314" width="92" height="12" rx="2" fill="#f5f5f5"/>
        <text x="422" y="323" fill="#4f5d75">CHECK → APPLY</text>

        <rect x="260" y="500" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="292" y="509" fill="#4f5d75">ROLLBACK</text>
      </g>

      <!-- Start dot -->
      <circle cx="64" cy="220" r="6" fill="#2d3142"/>

      <!-- State: Untouched -->
      <rect x="104" y="184" width="168" height="72" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="188" y="228" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Untouched</text>
      <text x="188" y="244" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">distro file, or absent</text>

      <!-- State: Written -->
      <rect x="392" y="184" width="168" height="72" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="400" y="192" width="52" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="426" y="201" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CHANGED:</text>
      <text x="476" y="228" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Written</text>
      <text x="476" y="244" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">.anvil.bak + manifest</text>

      <!-- State: Aligned (focal) -->
      <rect x="680" y="184" width="168" height="72" rx="8" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
      <rect x="688" y="192" width="28" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.50)" stroke-width="0.8"/>
      <text x="702" y="201" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OK:</text>
      <text x="764" y="228" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Aligned</text>
      <text x="764" y="244" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">matches declaration</text>

      <!-- State: Drifted -->
      <rect x="392" y="384" width="168" height="72" rx="8" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="400" y="392" width="52" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="426" y="401" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DRIFTED:</text>
      <text x="476" y="428" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Drifted</text>
      <text x="476" y="444" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">edited out of band</text>

      <!-- Callout -->
      <text x="216" y="540" fill="#4f5d75" font-size="13" font-style="italic" font-family="'Instrument Serif', serif">Rollback works from any state: it restores each .anvil.bak, or deletes the file if anvil created it.</text>
      <text x="216" y="556" fill="#4f5d75" font-size="13" font-style="italic" font-family="'Instrument Serif', serif">The guard revert does the same for one run. Commands (packages, users, ufw rules) are never undone.</text>

      </g>

      <!-- Legend strip -->
      <line x1="40" y1="572" x2="920" y2="572" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <g font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75" letter-spacing="0.06em">
        <rect x="40" y="580" width="16" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="62" y="588">STATE</text>
        <rect x="112" y="580" width="16" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="134" y="588">CONVERGED</text>
        <line x1="208" y1="585" x2="232" y2="585" stroke="#bf4520" stroke-width="1.4"/>
        <text x="238" y="588">RELOAD GUARD REVERT</text>
        <line x1="356" y1="585" x2="380" y2="585" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4"/>
        <text x="386" y="588">OPERATOR ROLLBACK</text>
        <rect x="496" y="580" width="40" height="10" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="542" y="588">MARKER THE ENGINE PRINTS</text>
      </g>
    </svg>
    </div>
  </div>
</body>
</html>
