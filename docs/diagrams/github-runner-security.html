    <p class="eyebrow">Security · [github_runner] · v1 → v2</p>
    <h1>v1 keeps no GitHub key on the box; v2 trades one in for fresh runners</h1>
    <div class="diagram-container">
<svg data-diagram="architecture-delta" viewBox="0 0 1280 580" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="github-runner-security-title github-runner-security-desc">
<title id="github-runner-security-title">GitHub runner credentials: v1 vs v2</title>
<desc id="github-runner-security-desc">In v1 (built) a persistent runner is registered once with a one-hour token from the operator's Mac and keeps only its own credential, which jobs running as the same user can read; in v2 (design only) a root JIT minter holds a long-lived GitHub App key and gives each job a fresh one-job runner, moving the high-value secret to root.</desc>
