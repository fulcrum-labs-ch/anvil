<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>One module over SSH · Sequence</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 1rem;
    }

    .frame { max-width: 1100px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    .scroll { overflow-x: auto; }
    svg { width: 100%; min-width: 960px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">anvil apply · one module · sshd</p>
    <h1>One module over SSH</h1>

    <div class="scroll">
    <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="apply-sequence-title apply-sequence-desc">
      <title id="apply-sequence-title">Converging sshd over SSH</title>
      <desc id="apply-sequence-desc">anvil sends a read-only probe script over one multiplexed ssh session, gets DRIFTED back, then sends the apply script on the same session; the target writes the sshd drop-in, validates it with sshd -t, and either reloads and reports CHANGED or restores the backups and reports FAILED.</desc>
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
        </pattern>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#bf4520"/>
        </marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <!-- LIFELINES — anvil 120 · ssh 360 · bash 600 · sshd 840 -->
      <line x1="120" y1="96" x2="120" y2="520" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="360" y1="96" x2="360" y2="520" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="600" y1="96" x2="600" y2="520" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="840" y1="96" x2="840" y2="520" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- ALT FRAME — guarded reload; spans anvil (left inset 56 so the tab clears its bar) · ssh · bash · sshd -->
      <rect x="64" y="320" width="800" height="192" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <rect x="64" y="320" width="40" height="16" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="84" y="332" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">ALT</text>
      <text x="136" y="352" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[sshd -t passes]</text>
      <line x1="72" y1="412" x2="856" y2="412" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="136" y="432" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[else · sshd -t fails]</text>

      <!-- ACTIVATION BARS -->
      <rect x="116" y="124" width="8" height="372" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="356" y="124" width="8" height="32" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="356" y="208" width="8" height="32" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="596" y="148" width="8" height="36" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="596" y="232" width="8" height="264" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="836" y="296" width="8" height="72" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

      <!-- PROBE PASS -->
      <!-- M1 anvil → ssh -->
      <line x1="124" y1="128" x2="355" y2="128" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="200" y="108" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="240" y="118" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PROBE SCRIPT</text>

      <!-- M2 ssh → bash -->
      <line x1="364" y1="152" x2="595" y2="152" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="436" y="132" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="480" y="142" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SCRIPT · STDIN</text>

      <!-- M3 bash → anvil (return) -->
      <line x1="596" y1="180" x2="125" y2="180" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="212" y="160" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="240" y="170" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DRIFTED:</text>

      <!-- APPLY PASS -->
      <!-- M4 anvil → ssh -->
      <line x1="124" y1="212" x2="355" y2="212" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="200" y="192" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="240" y="202" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">APPLY SCRIPT</text>

      <!-- M5 ssh → bash -->
      <line x1="364" y1="236" x2="595" y2="236" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="440" y="216" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="480" y="226" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SAME SESSION</text>

      <!-- M6 bash self: backup + write -->
      <path d="M604 256 H624 Q632 256 632 264 Q632 272 624 272 H605" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="640" y="258" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="644" y="268" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">BACKUP · WRITE</text>

      <!-- M7 bash → sshd: validate -->
      <line x1="604" y1="300" x2="835" y2="300" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="692" y="280" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="720" y="290" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SSHD -T</text>

      <!-- ALT region 1 -->
      <!-- M8 bash → sshd: reload -->
      <line x1="604" y1="364" x2="835" y2="364" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="692" y="344" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="720" y="354" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RELOAD</text>

      <!-- M9 bash → anvil: CHANGED (headline) -->
      <line x1="596" y1="388" x2="125" y2="388" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <rect x="212" y="368" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="240" y="378" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CHANGED:</text>

      <!-- ALT region 2 -->
      <!-- M10 bash self: restore backups -->
      <path d="M604 452 H624 Q632 452 632 460 Q632 468 624 468 H605" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="640" y="454" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="644" y="464" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">RESTORE .BAK</text>

      <!-- M11 bash → anvil: FAILED (return) -->
      <line x1="596" y1="492" x2="125" y2="492" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="212" y="472" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="240" y="482" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FAILED:</text>

      <!-- ACTORS — drawn after arrows -->
      <!-- anvil (input) -->
      <rect x="40" y="40" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="40" width="160" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
      <rect x="48" y="48" width="28" height="12" rx="2" fill="transparent" stroke="rgba(90,101,128,0.40)" stroke-width="0.8"/>
      <text x="62" y="57" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CLI</text>
      <text x="120" y="72" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">anvil</text>
      <text x="120" y="87" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">operator machine</text>

      <!-- ssh (external) -->
      <rect x="280" y="40" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="280" y="40" width="160" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="288" y="48" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="302" y="57" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SSH</text>
      <text x="360" y="72" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">System ssh</text>
      <text x="360" y="87" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ControlMaster=auto</text>

      <!-- Target bash (backend) -->
      <rect x="520" y="40" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="520" y="40" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="528" y="48" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="544" y="57" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HOST</text>
      <text x="600" y="72" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Target bash</text>
      <text x="600" y="87" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">sudo -n bash -s</text>

      <!-- sshd (security) -->
      <rect x="760" y="40" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="760" y="40" width="160" height="56" rx="6" fill="rgba(191,69,32,0.05)" stroke="rgba(191,69,32,0.50)" stroke-width="1" stroke-dasharray="4,4"/>
      <rect x="768" y="48" width="28" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.50)" stroke-width="0.8"/>
      <text x="782" y="57" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SVC</text>
      <text x="840" y="72" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">sshd</text>
      <text x="840" y="87" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">05-anvil.conf</text>

      <!-- LEGEND -->
      <line x1="40" y1="540" x2="920" y2="540" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="572" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <line x1="112" y1="568" x2="140" y2="568" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="148" y="572" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Script sent over ssh</text>

      <line x1="260" y1="568" x2="288" y2="568" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="296" y="572" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Step on the host</text>

      <line x1="396" y1="568" x2="424" y2="568" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="432" y="572" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Marker line on stdout</text>

      <line x1="552" y1="568" x2="580" y2="568" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="588" y="572" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Converged</text>

      <rect x="664" y="560" width="28" height="18" rx="2" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="671" y="572" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace">ALT</text>
      <text x="700" y="572" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Guarded reload outcome</text>
    </svg>
    </div>
  </div>
</body>
</html>
