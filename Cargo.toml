[package]
name = "fulcrum-anvil"
version = "0.1.0"
edition = "2021"
description = "Fulcrum Anvil — declarative Linux server-hardening CLI"
license = "Apache-2.0"
readme = "README.md"
keywords = ["security", "hardening", "ssh", "debian", "cli"]
categories = ["command-line-utilities"]
repository = "https://github.com/fulcrum-labs-ch/anvil"

[[bin]]
name = "anvil"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.2"
thiserror = "2"
anyhow = "1"
base64 = "0.23"

[profile.release]
strip = true
lto = true

# cargo-mutants rebuilds the whole crate per mutant; without debug info the
# builds (~70 % of a mutant's time) are faster. Used via .cargo/mutants.toml.
[profile.mutants]
inherits = "test"
debug = false
